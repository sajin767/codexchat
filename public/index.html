<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CodexChat</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>CodexChat</h1>
          <p id="statusText">Connecting...</p>
        </div>
        <button id="stopButton" class="icon-button" type="button" title="Stop current turn" disabled>Stop</button>
      </header>

      <section id="approvals" class="approvals" aria-live="polite"></section>
      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <textarea id="prompt" rows="1" placeholder="Message Codex in this folder"></textarea>
        <button id="sendButton" type="submit">Send</button>
      </form>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
